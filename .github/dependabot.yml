# Dependency updates for the source repository.
#
# This is where they belong rather than on qalor-website-preview: that repo is a mirror pushed
# from here, so a pull request merged there would never reach this source and the next sync would
# overwrite it. Merged here, an update reaches qalor.nl through CI and the preview through the
# sync push.
#
# Monthly and grouped, unlike a project with more hands on it. This is a live client site: the
# useful cadence is one batch to read and verify, not a steady trickle of individual bumps that
# each cost a CI run and a deploy.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Build and test tooling. Nothing here ships to a visitor, so it can move as one.
      tooling:
        patterns:
          - '@biomejs/*'
          - '@playwright/*'
          - '@axe-core/*'
          - lighthouse
          - turbo
          - typescript
          - tsx
          - vite
          - '@vitejs/*'
          - '@types/*'
      # What the browser actually downloads. Minor and patch only: a major here is a visible
      # change to a client's site and wants to be a decision, not a merge.
      frontend:
        patterns:
          - react
          - react-dom
          - aos
          - '@fontsource/*'
        update-types: [minor, patch]
      # The admin API and the services behind it, on the same reasoning.
      backend:
        patterns:
          - express
          - cors
          - dotenv
          - firebase-admin
          - jsonwebtoken
          - multer
          - cloudinary
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
