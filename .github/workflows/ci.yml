name: CI

# Validates every push and pull request, and publishes only if those checks pass.
#
# The deploy lives in this workflow behind `needs:` rather than in a separate one on the
# same trigger. Two workflows on `push: master` run concurrently and the shorter usually
# wins, so a commit with failing tests ships to production and the checks only tell you
# afterwards. Keeping it here makes the ordering structural rather than a policy.
on:
  push:
    # Both, because this repo's default branch is `main` while the FTP deploy below is
    # gated to `master`: without `main` here, pushes to the default branch started no run
    # at all and the pipeline only ever ran when dispatched by hand. Adding it runs the
    # checks; the deploy job's own `if:` still restricts publishing to `master`.
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:
  # Content edited in the admin portal is live for a signed-in visitor immediately (see
  # ContentContext.tsx), but invisible to crawlers/first-paint visitors until the next
  # prerender build. This bounds that gap to a week without needing a manual redeploy after
  # every edit. Must stay in the deploy job's `if:` below, or this run builds and tests but
  # silently skips deploying.
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      # Runs against an in-memory store (packages/api/src/testing/memoryStore.ts), not real
      # Firestore — no credentials needed for this to pass.
      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Needs the build above: checks the gzipped initial-payload budget.
      - name: Budgets
        run: npm run check:budgets

  e2e:
    name: Layout, a11y and Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Only Chromium: these are layout/a11y assertions against one engine, not a
      # cross-browser matrix. Cached on the resolved version rather than reinstalled
      # every run — the browser binaries alone are ~300MB.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install --with-deps chromium failed three times"
          exit 1

      - name: Install Chromium's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # Retried: this is the only step that reaches out to Ubuntu's apt mirrors, and it
        # runs on every cache hit — so a transient mirror failure fails the whole job for a
        # reason that has nothing to do with the code. It has already done so once, with
        # `Installation process exited with code: 100`, and passed unchanged on a re-run.
        # Three attempts with a growing pause; still fatal if apt is genuinely broken.
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install-deps chromium failed three times"
          exit 1

      - name: Run layout and accessibility tests
        run: npm run test:e2e

      # Everything below runs against the built, prerendered output rather than the dev
      # server. That distinction is the point: prerendering is what produced a Hero that
      # painted a desktop layout and snapped to mobile after hydration, and the dev server
      # has no prerendered HTML at all — no test running against it could have caught that.
      # `prerender` gates itself on the same thing (see its first-paint parity check).
      - name: Build and prerender for audit
        run: npm run build && npm run prerender

      - name: Run the suite against the built output
        run: npm run test:e2e:dist

      # The GitHub Pages preview is served from a project subpath, and three bugs existed
      # only in that variant — a 404ing /admin, a crash inlining the stylesheet, and a link
      # that navigated off the site. None were reachable without actually producing it.
      - name: Build and prerender the subpath variant
        run: npm run build && npm run prerender
        env:
          VITE_BASE: /qalor-website-preview/
          NOINDEX: '1'

      - name: Check the subpath build
        run: npm run test:e2e:subpath

      # Rebuild at the domain root: the subpath build above overwrote dist, and Lighthouse
      # must audit what actually ships to qalor.nl.
      - name: Rebuild for audit
        run: npm run build && npm run prerender

      - name: Lighthouse
        run: npm run check:lighthouse

      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '### Layout test failures'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' test-results/*/error-context.md 2>/dev/null | head -80 \
              || echo 'no error context captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy via FTP
    needs: [verify, e2e]
    # Never from a pull request — a PR build must not publish to production.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Needs a browser: the prerenderer boots the built app and writes the resulting DOM
      # into index.html so a visitor's first response is real markup, not a blank shell.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install --with-deps chromium failed three times"
          exit 1

      - name: Install Chromium's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # Retried: this is the only step that reaches out to Ubuntu's apt mirrors, and it
        # runs on every cache hit — so a transient mirror failure fails the whole job for a
        # reason that has nothing to do with the code. It has already done so once, with
        # `Installation process exited with code: 100`, and passed unchanged on a re-run.
        # Three attempts with a growing pause; still fatal if apt is genuinely broken.
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install-deps chromium failed three times"
          exit 1

      - name: Build
        run: npm run build

      # VITE_API_URL is a repo secret (Settings -> Secrets and variables -> Actions ->
      # Secrets) pointing at the deployed packages/api instance (see ADMIN.md) — unset
      # until that's provisioned, in which case this falls back to the bundled defaults in
      # packages/shared with a warning, same as running it locally with no API configured.
      - name: Prerender, sitemap and robots
        run: npm run prerender
        env:
          SITE_URL: https://qalor.nl
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # server-dir is a repo variable (Settings -> Secrets and variables -> Actions ->
      # Variables), not a secret — it's just a path, e.g. /public_html/. Defaults to the
      # FTP account's own root if unset. FTP_SERVER/FTP_USERNAME/FTP_PASSWORD are repo
      # secrets that need to be added before this job can actually deploy — see the
      # migration plan for what this repo cannot set up on its own.
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./packages/web/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
