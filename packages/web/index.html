<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets data-theme on <html> before anything paints, so there's no flash of the
         wrong theme and nothing for React to disagree with on first render (it never
         manages this attribute itself — see ThemeContext.tsx). Deliberately a plain,
         blocking script tag, not type="module": those defer until after parsing, which
         would be too late — the whole point is running before first paint.

         Light is the standard first-visit theme, not the OS's prefers-color-scheme: a
         first-time visitor always gets light regardless of their system setting: only an
         explicit toggle (persisted below) switches it to dark. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (_e) {}
      })();
    </script>
    <!-- Every content image is Cloudinary-hosted, including the Hero photo (the LCP
         candidate) — this starts the cross-origin DNS/TLS handshake immediately instead
         of after React has rendered the <img> tag that would otherwise trigger it. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="icon" type="image/png" href="/qalor Q.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Qalor — energiedeskundigen voor warmtenetten: advies, ontwerp en realisatie van energie-efficiënte warmteoplossingen voor gebouwen en wijken."
    />
    <title>Qalor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
