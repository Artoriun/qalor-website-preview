<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets data-theme on <html> before anything paints, so there's no flash of the
         wrong theme and nothing for React to disagree with on first render (it never
         manages this attribute itself — see ThemeContext.tsx). Deliberately a plain,
         blocking script tag, not type="module": those defer until after parsing, which
         would be too late — the whole point is running before first paint.

         Light is the standard first-visit theme, not the OS's prefers-color-scheme: a
         first-time visitor always gets light regardless of their system setting: only an
         explicit toggle (persisted below) switches it to dark.

         The key is versioned ('theme-v2', was 'theme') because "first-time visitor" stopped
         being true for anyone who had ever tried the toggle: their stored 'dark' outlived
         the decision to standardise on light, and a value already sitting in someone else's
         browser cannot be reached any other way. Bumping the suffix resets everyone to light
         exactly once. The stale 'theme' key is left where it is on purpose — clearing it
         means shipping a removeItem() that runs on every load forever to reclaim a few
         bytes. Bump again only for another deliberate reset, and change ThemeContext.tsx's
         setItem to match: these two strings are one key, and nothing enforces that. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme-v2');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (_e) {}
      })();
    </script>
    <!-- Every content image is Cloudinary-hosted, including the Hero photo (the LCP
         candidate) — this starts the cross-origin DNS/TLS handshake immediately instead
         of after React has rendered the <img> tag that would otherwise trigger it. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- Proves ownership of qalor.nl to Google Search Console, which is the only way to
         reach URL Inspection and ask for a recrawl — Google consumes neither IndexNow (see
         scripts/ping-indexnow.mjs) nor a sitemap ping, so this tag is the entry point to the
         one fast path it does offer. It lives here rather than in a verification file
         because scripts/prerender.mjs writes every route from this shell, so one line covers
         all five pages and survives future deploys. Not a secret: it is served to everyone
         who loads the page, and only states that whoever set it can edit this site.
         Removing it un-verifies the property. -->
    <meta
      name="google-site-verification"
      content="HcrSuwETYsLjiyXW0w8eibTz1wasB3e3z7xORHR8pl8"
    />
    <link rel="icon" type="image/png" href="/qalor Q.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Qalor — energiedeskundigen voor warmtenetten: advies, ontwerp en realisatie van energie-efficiënte warmteoplossingen voor gebouwen en wijken."
    />
    <title>Warmtenet ontwerp, tekening en berekening | Qalor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
